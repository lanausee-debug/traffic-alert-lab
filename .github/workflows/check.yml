name: Saved result consistency
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python verify_release.py
      - run: python build_thesis_experiment_draft.py --check
